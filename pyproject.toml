[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-okta"
version = "0.1.0"
description = "Okta for agents: who each agent is and what it is allowed to touch"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-okta = "agent_okta.__main__:main"

[tool.setuptools]
packages = ["agent_okta"]
